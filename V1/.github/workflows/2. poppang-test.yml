name: 팝팡 모듈러 테스트

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 번호(명령어 트리거일 때만 입력)"
        required: false
        default: ""
      triggered_by_command:
        description: "PR 명령어로 실행되면 true"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment test start
        if: github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            Core/Data 모듈 테스트를 시작합니다.

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install CI tools
        run: |
          gem install xcpretty --no-document
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install tuist@$(cat .tuist-version)

      - name: Disable Swift Macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Create CI Secrets.xcconfig
        run: |
          cat <<EOF > Projects/App/Secrets.xcconfig
          KAKAO_NATIVE_APP_KEY = cidummy
          NMFClientID = cidummy
          GoogleURLScheme = cidummy
          GIDClientID = cidummy
          ADMOB_APP_ID = ca-app-pub-3940256099942544~1458002511
          ADMOB_NATIVE_AD_UNIT_ID = ca-app-pub-3940256099942544/3986624511
          EOF

      - name: Generate Tuist workspace
        run: |
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist install
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist generate

      - name: Resolve test simulator
        id: test_simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "destination=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Run Core tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace PopPang.xcworkspace \
            -scheme Core \
            -destination '${{ steps.test_simulator.outputs.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run Data tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace PopPang.xcworkspace \
            -scheme Data \
            -destination '${{ steps.test_simulator.outputs.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Comment success
        if: success() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            Core/Data 모듈 테스트가 성공했습니다.

      - name: Comment failure
        if: failure() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            Core/Data 모듈 테스트가 실패했습니다. Actions 로그를 확인해주세요.
