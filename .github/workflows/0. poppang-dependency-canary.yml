name: 팝팡 최신 의존성 호환성 점검

on:
  # 🔁 매주 1회 자동 실행 (월요일 새벽 3시)
  schedule:
    - cron: "0 3 * * 1"

  # ▶️ 필요할 때 수동 실행
  workflow_dispatch:

jobs:
  dependency-canary:
    name: Dependency Canary Build (Latest SPM)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: List installed Xcodes
        run: ls /Applications | grep Xcode

      # ======================
      # 2️⃣ Xcode 선택
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
        
      # ======================
      # 3️⃣ swift Macro 검증 해제
      # ======================
      - name: Disable Swift Macro fingerprint validation
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # ======================
      # 4️⃣ Swift 버전 확인
      # ======================
      - name: Swift Version
        run: swift --version

      # ======================
      # 4️⃣ Package.resolved 제거 (고정 해제)
      # ======================
      - name: Remove Package.resolved
        run: |
          echo "🧹 Removing Package.resolved"
          rm -f **/Package.resolved

      # ======================
      # 5️⃣ Build (SPM resolve 포함)
      # ======================
      - name: Build with Latest Dependencies (Canary)
        run: |
          echo "🚧 Build triggers SPM resolve automatically"
          xcodebuild \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

      # ======================
      # 6️⃣ Smoke Tests (선택)
      # ======================
      - name: Smoke Tests (Optional)
        run: |
          echo "🧪 Running smoke tests"
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PopPangUITests/SmokeTests \
            | xcpretty
            
      # ======================
      # 📦 Resolved Dependency Versions 출력
      # ======================
      - name: Print Resolved SPM Versions
        run: |
          echo "📦 Resolved Swift Package Versions"
          for file in $(find . -name Package.resolved); do
            echo "----- $file -----"
            cat "$file" \
              | jq -r '.pins[] | "\(.identity): \(.state.version)"'
          done
