name: 팝팡 모듈러 의존성 점검

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  dependency-canary:
    name: Tuist Dependency Canary
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install CI tools
        run: |
          gem install xcpretty --no-document
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install tuist@$(cat .tuist-version)

      - name: Disable Swift Macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Resolve Tuist dependencies from manifest
        run: |
          rm -f Tuist/Package.resolved
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist install
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist generate

      - name: Build PopPangApp with resolved dependencies
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace PopPang.xcworkspace \
            -scheme PopPangApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Print resolved dependency versions
        run: |
          echo "Resolved Swift package versions"
          find Tuist -name Package.resolved -print -exec cat {} \;
