name: 팝팡 모듈러 의존성 점검

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 번호(명령어 트리거일 때만 입력)"
        required: false
        default: ""
      triggered_by_command:
        description: "PR 명령어 트리거 여부"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dependency-canary:
    name: Tuist Dependency Canary
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install CI tools
        run: |
          gem install xcpretty --no-document
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install tuist@$(cat .tuist-version)

      - name: Disable Swift Macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Create CI Secrets.xcconfig
        run: |
          cat <<EOF > Projects/App/Secrets.xcconfig
          KAKAO_NATIVE_APP_KEY = cidummy
          NMFClientID = cidummy
          GoogleURLScheme = cidummy
          GIDClientID = cidummy
          ADMOB_APP_ID = ca-app-pub-3940256099942544~1458002511
          ADMOB_NATIVE_AD_UNIT_ID = ca-app-pub-3940256099942544/3986624511
          EOF
          cat <<EOF > Projects/Features/HomeFeatureV2/Demo/HomeFeatureV2Demo.xcconfig
          ADMOB_APP_ID = cidummy
          HOME_DEMO_USER_UUID = cidummy
          EOF

      - name: Resolve Tuist dependencies from manifest
        run: |
          rm -f Tuist/Package.resolved
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist install
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist generate

      - name: Build PopPangApp with resolved dependencies
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace PopPang.xcworkspace \
            -scheme PopPangApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Print resolved dependency versions
        run: |
          echo "Resolved Swift package versions"
          find Tuist -name Package.resolved -print -exec cat {} \;

      - name: Comment success
        if: success() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            최신 허용 라이브러리 버전 기준 의존성 점검이 성공했습니다.

      - name: Comment failure
        if: failure() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            최신 허용 라이브러리 버전 기준 의존성 점검이 실패했습니다. Actions 로그를 확인해주세요.
