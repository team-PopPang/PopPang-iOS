name: 팝팡 앱타겟 iOS17 빌드 테스트

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  ios-ci:
    name: iOS Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls /Applications | grep Xcode

      # ======================
      # 2️⃣ Select Xcode
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # ======================
      # 3️⃣ Swift Version
      # ======================
      - name: Swift Version
        run: swift --version

      # ======================
      # 4️⃣ Cache Xcode & SPM
      # ======================
      - name: Cache Xcode & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Developer/Xcode/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      # ======================
      # 5️⃣ Create Config.xcconfig (from Secrets)
      # ======================
      - name: Create Config.xcconfig from Secrets
        run: |
          cat <<EOF > Config.xcconfig
          // =====================================
          // Generated by GitHub Actions (CI only)
          // This file will be deleted with runner
          // =====================================

          // Kakao
          KAKAO_NATIVE_APP_KEY = ${{ secrets.KAKAO_NATIVE_APP_KEY }}

          // Google Sign-In
          GIDClientID = ${{ secrets.GIDClientID }}
          GoogleURLScheme = ${{ secrets.GoogleURLScheme }}

          // Naver Map
          NMFClientID = ${{ secrets.NMFClientID }}
          EOF

      # ======================
      # 6️⃣ Resolve SPM (안정성 핵심)
      # ======================
      - name: Resolve SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PopPang.xcodeproj \
            -scheme PopPang

      # ======================
      # 7️⃣ Build
      # ======================
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ======================
      # 8️⃣ Smoke Tests
      # ======================
      - name: Smoke Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PopPangUITests/SmokeTests \
            | xcpretty

      # ======================
      # 9️⃣ Unit Tests
      # ======================
      - name: Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:RepositoryTest \
            | xcpretty

      # ======================
      # 🔟 UI Tests
      # ======================
      - name: UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PopPangUITests \
            | xcpretty

