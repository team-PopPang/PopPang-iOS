name: 팝팡 앱타겟 iOS17 빌드 & 테스트 v3

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 번호(명령어 트리거일 때만 입력)"
        required: false
        default: ""
      triggered_by_command:
        description: "PR 명령어 트리거 여부"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ios-ci:
    name: iOS Build & Test (xcodebuild warm-up + UDID)
    runs-on: macos-14

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - name: Checkout PR branch
        if: github.event.inputs.pr_number != ''
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout default branch
        if: github.event.inputs.pr_number == ''
        uses: actions/checkout@v4

      # ======================
      # 2️⃣ Cache
      # ======================
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ======================
      # 3️⃣ Xcode 선택
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # ======================
      # 🔥 4️⃣ Simulator Warm-up (xcodebuild)
      # ======================
      - name: Warm up simulator (iPhone 15 / iOS 17.5)
        run: |
          set -e
          echo "🔥 Warm-up iPhone 15 (iOS 17.5)"
          xcodebuild \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -showdestinations \
            > /dev/null

      # ======================
      # 🔒 5️⃣ UDID 고정
      # ======================
      - name: Resolve simulator UDID
        run: |
          SIMULATOR_NAME="iPhone 15"
          SIMULATOR_OS="17.5"

          UDID=$(xcrun simctl list devices available | \
            grep "$SIMULATOR_NAME ($SIMULATOR_OS)" | head -n 1 | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')

          if [ -z "$UDID" ]; then
            echo "❌ Simulator UDID not found for $SIMULATOR_NAME ($SIMULATOR_OS)"
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          echo "✅ Using simulator UDID: $UDID"

      # ======================
      # 6️⃣ Swift Macro 검증 해제
      # ======================
      - name: Disable Swift Macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # ======================
      # 7️⃣ Swift Version
      # ======================
      - name: Swift Version
        run: swift --version

      # ======================
      # 8️⃣ Config.xcconfig 생성
      # ======================
      - name: Create Config.xcconfig from Secrets
        run: |
          cat <<EOF > Config.xcconfig
          KAKAO_NATIVE_APP_KEY = ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GIDClientID = ${{ secrets.GIDClientID }}
          GoogleURLScheme = ${{ secrets.GoogleURLScheme }}
          NMFClientID = ${{ secrets.NMFClientID }}
          EOF

      # ======================
      # 9️⃣ Build
      # ======================
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ======================
      # 🔟 Unit Test
      # ======================
      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:RepositoryTest \
            | xcpretty

      # ======================
      # UI Test
      # ======================
      - name: Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:PopPangUITests \
            | xcpretty

      # ======================
      # PR 댓글 (명령어 트리거일 때만)
      # ======================
      - name: Comment success
        if: success() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            ✅ **팝팡 패키지를 성공적으로 빌드하고 테스트했습니다.**

      - name: Comment failure
        if: failure() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            ❌ **팝팡 패키지 빌드 또는 테스트에 실패했습니다.**
            👉 Actions 탭에서 로그를 확인해주세요.

      # ======================
      # 📧 Email 알림
      # ======================
      - name: Send email on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ✅ PopPang iOS 빌드 & 테스트 성공
          body: |
            ✅ **팝팡 패키지를 성공적으로 빌드하고 테스트했습니다.**

            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Triggered by: ${{ github.actor }}
            🔗 Action URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ❌ PopPang iOS 빌드 실패
          body: |
            ❌ **팝팡 패키지 빌드 또는 테스트에 실패했습니다.**

            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Triggered by: ${{ github.actor }}
            🔗 Action URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
