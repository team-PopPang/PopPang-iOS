name: 팝팡 앱타겟 iOS17 빌드 & 테스트 v3

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ios-ci:
    name: iOS Build & Test (warm-up + UDID + UI reset)
    runs-on: macos-14

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - uses: actions/checkout@v4

      # ======================
      # 2️⃣ Cache
      # ======================
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ======================
      # 3️⃣ Xcode 선택
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # ======================
      # 🔥 4️⃣ Simulator Warm-up (xcodebuild)
      # ======================
      - name: Warm up simulator (iPhone 15 / iOS 17.5)
        run: |
          set -e
          echo "🔥 Warm-up iPhone 15 (iOS 17.5)"
          xcodebuild \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -showdestinations \
            > /dev/null

      # ======================
      # 🔒 5️⃣ Resolve Simulator UDID
      # ======================
      - name: Resolve simulator UDID
        run: |
          SIMULATOR_NAME="iPhone 15"

          UDID=$(xcrun simctl list devices available | \
            grep "$SIMULATOR_NAME (" | head -n 1 | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')

          if [ -z "$UDID" ]; then
            echo "❌ Simulator UDID not found"
            exit 1
          fi

          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          echo "✅ Using simulator UDID: $UDID"

      # ======================
      # 6️⃣ Config.xcconfig
      # ======================
      - name: Create Config.xcconfig
        run: |
          cat <<EOF > Config.xcconfig
          KAKAO_NATIVE_APP_KEY = ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GIDClientID = ${{ secrets.GIDClientID }}
          GoogleURLScheme = ${{ secrets.GoogleURLScheme }}
          NMFClientID = ${{ secrets.NMFClientID }}
          EOF

      # ======================
      # 7️⃣ Build
      # ======================
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ======================
      # 8️⃣ Unit Tests
      # ======================
      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:RepositoryTest \
            | xcpretty

      # ======================
      # 🧹 9️⃣ Reset Simulator before UI Tests
      # ======================
      - name: Reset simulator before UI Tests
        run: |
          echo "🧹 Reset simulator before UI Tests"
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # ======================
      # 🔟 UI Tests
      # ======================
      - name: Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:PopPangUITests \
            | xcpretty