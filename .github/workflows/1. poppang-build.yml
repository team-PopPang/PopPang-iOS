name: 팝팡 앱타겟 iOS17 빌드

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 번호(명령어 트리거일 때만 입력)"
        required: false
        default: ""
      triggered_by_command:
        description: "PR 명령어로 실행되면 true"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Comment build start
        if: github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            🔨 iOS 17.5 iPhone 15 에서 팝팡 패키지를 빌드합니다.

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Disable Swift Macro fingerprint validation
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Create Config.xcconfig
        run: |
          cat <<EOF > Config.xcconfig
          KAKAO_NATIVE_APP_KEY = ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GIDClientID = ${{ secrets.GIDClientID }}
          GoogleURLScheme = ${{ secrets.GoogleURLScheme }}
          NMFClientID = ${{ secrets.NMFClientID }}
          EOF

      - name: Build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ✅ 성공 댓글 (PR 명령어 실행일 때만)
      - name: Comment success
        if: success() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            🤖 **PopPang CI**
            상태: ✅ 성공
            워크플로우: `${{ github.workflow }}`

      # ❌ 실패 댓글 (PR 명령어 실행일 때만)
      - name: Comment failure
        if: failure() && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            🤖 **PopPang CI**
            상태: ❌ 실패
            워크플로우: `${{ github.workflow }}`
            👉 Actions 탭에서 로그를 확인하세요.
