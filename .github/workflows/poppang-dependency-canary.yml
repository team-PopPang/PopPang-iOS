name: PopPang Dependency Canary CI

on:
  # 🔁 매주 1회 자동 실행 (월요일 새벽 3시)
  schedule:
    - cron: "0 3 * * 1"

  # ▶️ 필요할 때 수동 실행
  workflow_dispatch:

jobs:
  dependency-canary:
    name: Dependency Canary Build (Latest SPM)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================
      # 2️⃣ Xcode 선택
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app

      # ======================
      # ⚠️ Xcode FileSystem Sync Group 강제 활성화 (Canary hack)
      # ======================
      - name: Enable Xcode FileSystem Synchronized Groups
        run: |
          echo "⚠️ Enabling IDEFileSystemSynchronizedGroupsAreEnabled"
          defaults write com.apple.dt.Xcode IDEFileSystemSynchronizedGroupsAreEnabled -bool YES

      # ======================
      # 3️⃣ Swift 버전 확인
      # ======================
      - name: Swift Version
        run: swift --version

      # ======================
      # 4️⃣ Package.resolved 제거
      # ======================
      - name: Remove Package.resolved
        run: |
          echo "🧹 Removing Package.resolved"
          rm -f **/Package.resolved

      # ======================
      # 5️⃣ 최신 의존성 Resolve (project 기반)
      # ======================
      - name: Resolve Latest Dependencies
        run: |
          echo "📦 Resolving latest SPM dependencies (project-based)"
          xcodebuild \
            -resolvePackageDependencies \
            -project PopPang.xcodeproj \
            -scheme PopPang

      # ======================
      # 6️⃣ 최신 의존성으로 Build
      # ======================
      - name: Build with Latest Dependencies
        run: |
          echo "🚧 Building with latest dependencies"
          xcodebuild \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

      # ======================
      # 7️⃣ Smoke Tests (선택)
      # ======================
      - name: Smoke Tests (Optional)
        run: |
          echo "🧪 Running smoke tests with latest dependencies"
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PopPangUITests/SmokeTests \
            | xcpretty
