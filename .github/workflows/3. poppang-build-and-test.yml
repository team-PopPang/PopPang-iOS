name: 팝팡 모듈러 빌드 & 테스트

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 번호(명령어 트리거일 때만 입력)"
        required: false
        default: ""
      triggered_by_command:
        description: "PR 명령어 트리거 여부"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write

# 같은 PR/브랜치에서 새 커밋이 올라오면 이전 CI를 취소하고 최신 커밋만 검사한다.
# - pull_request: PR 번호 기준으로 묶음
# - workflow_dispatch(pr_number): 명령어 트리거 PR 번호 기준으로 묶음
# - 그 외(schedule/manual without pr_number): 브랜치 이름 기준으로 묶음
concurrency:
  group: poppang-build-and-test-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  module_ci:
    name: ${{ matrix.job_name }} (${{ matrix.scheme }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Domain 타깃은 app-build가 PopPangApp을 빌드할 때 함께 빌드되어 따로 job을 두지 않는다.
        include:
          - job_name: app-build
            scheme: PopPangApp
            xcode_action: build
            destination: generic/platform=iOS Simulator
          - job_name: core-test
            scheme: Core
            xcode_action: test
            destination: platform=iOS Simulator
          - job_name: data-test
            scheme: Data
            xcode_action: test
            destination: platform=iOS Simulator
          - job_name: dskit-build
            scheme: DSKit
            xcode_action: build
            destination: generic/platform=iOS Simulator

    steps:
      - name: Checkout PR branch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout default branch
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.pr_number == ''
        uses: actions/checkout@v4

      # Tuist 버전마다 Tuist/.build와 생성 project 구조가 달라 아래 캐시 키에는 모두 .tuist-version을 넣는다.
      # 4.210.0부터 Tuist/.build/checkouts가 ~/.cache/swifterpm을 가리키는 링크라 함께 캐시한다.
      - name: Cache Tuist and SwiftPM
        id: spm_cache
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
            ~/Library/Caches/org.swift.swiftpm
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('.tuist-version') }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            tuist-spm-${{ runner.os }}-${{ hashFiles('.tuist-version') }}-

      # DerivedData의 외부 라이브러리 빌드 결과는 패키지 파일의 수정 시각이 기록과 같아야 다시 쓰인다.
      # 그래서 위 패키지 캐시를 그대로 받은 실행에서 만든 DerivedData만 저장한다(Save DerivedData 단계).
      # 우리 모듈은 체크아웃할 때마다 수정 시각이 새로 찍혀 어차피 다시 컴파일되므로, 키는 Package.resolved와 Tuist 버전만 본다.
      - name: Restore DerivedData
        id: deriveddata_cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData/${{ matrix.scheme }}
          key: deriveddata-v2-arm64-${{ runner.os }}-${{ matrix.scheme }}-${{ hashFiles('.tuist-version') }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            deriveddata-v2-arm64-${{ runner.os }}-${{ matrix.scheme }}-${{ hashFiles('.tuist-version') }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install CI tools
        run: |
          gem install xcpretty --no-document
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install tuist@$(cat .tuist-version)

      - name: Disable Swift Macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Create CI Secrets.xcconfig
        run: |
          cat <<EOF > Projects/App/Secrets.xcconfig
          KAKAO_NATIVE_APP_KEY = cidummy
          NMFClientID = cidummy
          GoogleURLScheme = cidummy
          GIDClientID = cidummy
          ADMOB_APP_ID = cidummy
          ADMOB_NATIVE_AD_UNIT_ID = cidummy
          EOF
          cat <<EOF > Projects/Features/HomeFeatureV2/Demo/HomeFeatureV2Demo.xcconfig
          ADMOB_APP_ID = cidummy
          HOME_DEMO_USER_UUID = cidummy
          EOF

      - name: Download React Native release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-rn-release.sh v1.0.0

      - name: Generate Tuist workspace
        # 바이너리 캐시를 쓰지 않아(Tuist 서버 미연결) 타깃마다 내용 해시를 계산해 캐시를 찾는 단계를 건너뛴다.
        run: |
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist install
          "$HOME/.local/bin/mise" x tuist@$(cat .tuist-version) -- tuist generate --no-binary-cache

      - name: Resolve test simulator
        if: matrix.xcode_action == 'test'
        id: test_simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "destination=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.job_name }}
        env:
          XCODE_ACTION: ${{ matrix.xcode_action }}
          XCODE_DESTINATION: ${{ matrix.destination }}
          XCODE_SCHEME: ${{ matrix.scheme }}
          TEST_SIMULATOR_DESTINATION: ${{ steps.test_simulator.outputs.destination }}
        run: |
          set -o pipefail
          if [ "$XCODE_ACTION" = "test" ] && [ -n "$TEST_SIMULATOR_DESTINATION" ]; then
            XCODE_DESTINATION="$TEST_SIMULATOR_DESTINATION"
          fi

          echo "Using destination: $XCODE_DESTINATION"
          # generic 시뮬레이터 대상은 ONLY_ACTIVE_ARCH를 무시하고 arm64와 x86_64를 모두 빌드한다.
          # CI 러너는 Apple Silicon이라 ARCHS=arm64로 시뮬레이터용 arm64만 빌드한다.
          xcodebuild "$XCODE_ACTION" \
            -workspace PopPang.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -destination "$XCODE_DESTINATION" \
            -derivedDataPath "DerivedData/$XCODE_SCHEME" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            | xcpretty

      - name: Save DerivedData
        if: steps.spm_cache.outputs.cache-hit == 'true' && steps.deriveddata_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: DerivedData/${{ matrix.scheme }}
          key: ${{ steps.deriveddata_cache.outputs.cache-primary-key }}

  notify:
    name: Notify CI result
    runs-on: ubuntu-latest
    needs: module_ci
    if: always()

    steps:
      - name: Comment success
        if: needs.module_ci.result == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            모듈러 병렬 CI가 성공했습니다.

            - app-build: PopPangApp
            - core-test: Core
            - data-test: Data
            - dskit-build: DSKit

      - name: Comment failure
        if: needs.module_ci.result != 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.triggered_by_command == 'true' && github.event.inputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            모듈러 병렬 CI가 실패했습니다. Actions 로그를 확인해주세요.

      - name: Send email on success
        if: needs.module_ci.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: PopPang 모듈러 빌드 & 테스트 성공
          body: |
            모듈러 병렬 CI가 성공했습니다.

            - app-build: PopPangApp
            - core-test: Core
            - data-test: Data
            - dskit-build: DSKit

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Action URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>

      - name: Send email on failure
        if: needs.module_ci.result != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: PopPang 모듈러 빌드 또는 테스트 실패
          body: |
            모듈러 병렬 CI가 실패했습니다.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Action URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
