name: 팝팡 앱타겟 iOS17 빌드 & 테스트

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  ios-ci:
    name: iOS Build & Test
    runs-on: macos-14
    # timeout-minutes: 30

    steps:
      # ======================
      # 1️⃣ Checkout
      # ======================
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls /Applications | grep Xcode

      # ======================
      # 2️⃣ Select Xcode
      # ======================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
        
      # ======================
      # 3️⃣ swift Macro 검증 해제
      # ======================
      - name: Disable Swift Macro fingerprint validation
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # ======================
      # 4️⃣ Swift Version
      # ======================
      - name: Swift Version
        run: swift --version

      # ======================
      # 5️⃣ Create Config.xcconfig (from Secrets)
      # ======================
      - name: Create Config.xcconfig from Secrets
        run: |
          cat <<EOF > Config.xcconfig
          // =====================================
          // Generated by GitHub Actions (CI only)
          // This file will be deleted with runner
          // =====================================

          // Kakao
          KAKAO_NATIVE_APP_KEY = ${{ secrets.KAKAO_NATIVE_APP_KEY }}

          // Google Sign-In
          GIDClientID = ${{ secrets.GIDClientID }}
          GoogleURLScheme = ${{ secrets.GoogleURLScheme }}

          // Naver Map
          NMFClientID = ${{ secrets.NMFClientID }}
          EOF

      # ======================
      # 6️⃣ Build
      # ======================
      - name: Build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
            
      # ======================
      # 7️⃣ Unit Test + UI Test
      # ======================
      - name: Run Unit & UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PopPang.xcodeproj \
            -scheme PopPang \
            -xcconfig Config.xcconfig \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
